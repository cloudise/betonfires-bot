# Paid worker and disk: review the Render quote before deployment.
services:
- type: worker
  name: betonfires-bot
  runtime: python
  region: frankfurt
  plan: 0.5c-512mb
  numInstances: 1
  autoDeployTrigger: 'off'
  buildCommand: python -m unittest discover -s tests -v
  startCommand: python -u cloud_start.py
  disk:
    name: esports-data
    mountPath: /var/data
    sizeGB: 1
  envVars:
  - key: TELEGRAM_BOT_TOKEN
    sync: false
  - key: PAIRING_CODE
    generateValue: true
  - key: BOT_DB
    value: /var/data/research.sqlite3
  - key: BETBOOM_AUTO
    value: '0'
  - key: BETBOOM_POLL_SECONDS
    value: '300'
  - key: PYTHONUNBUFFERED
    value: '1'
